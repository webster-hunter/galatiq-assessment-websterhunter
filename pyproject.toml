[project]
name = "acme-invoice-normalizer"
version = "0.1.0"
description = "Deterministic invoice normalizer: invoice files in, standard invoices with graded flags out."
requires-python = ">=3.11"  # the tests are run on 3.11 and 3.13; 3.10 has not been tried
dependencies = []  # standard library only

[project.optional-dependencies]
# pymupdf is pinned to one version on purpose: a recording in data/replays is keyed by the text
# sent to the model, and another version could space a PDF's text differently and miss it.
llm = ["pymupdf==2.1", "python-dotenv>=1.0"]  # PDF text, .env for the CLI; the API client is stdlib
# main.py, review.py and pipeline/: the stages wired as a graph, with runs saved to SQLite so a
# held invoice can be released later.
pipeline = ["langgraph>=1.2,<2", "langgraph-checkpoint-sqlite>=3.1,<4"]
# The review screen: python -m web. The page is TypeScript in web/frontend, compiled to web/static/app.js (committed).
web = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "pymupdf==2.1", "python-dotenv>=1.0", "langgraph>=1.2,<2", "langgraph-checkpoint-sqlite>=3.1,<4",
       "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]  # httpx: FastAPI's test client

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["normalizer", "extraction", "approval", "ledger", "pipeline", "rates", "web"]  # explicit: data/, tests/ and seed_inventory.py are not part of the package

[tool.setuptools.package-data]
web = ["static/*"]  # the page, its styles and the compiled script

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
