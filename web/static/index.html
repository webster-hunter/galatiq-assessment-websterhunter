<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice review</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <h1>Invoice review</h1>
    <p id="totals"></p>
  </header>
  <p id="problem" role="alert" hidden></p>
  <main>
    <nav aria-label="Invoices">
      <h2>Waiting for a decision <span id="count" class="count"></span></h2>
      <ul id="waiting"></ul>
      <h2>Decided</h2>
      <ul id="decided"></ul>
    </nav>
    <section id="detail" aria-live="polite"></section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
